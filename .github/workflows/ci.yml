name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar Python y dependencias
        run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formato)
        run: uv run ruff format --check .
      - name: Tipos (pyright)
        run: uv run pyright
      - name: Tests
        run: uv run pytest
