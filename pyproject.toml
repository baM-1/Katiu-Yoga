[project]
name = "katiu"
version = "0.1.0"
description = "Mini app para que Kat lleve alumnos, asistencias, cobros y recordatorios sin copiar un solo ID."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.115",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.49",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pre-commit>=4.0",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.fastapi]
entrypoint = "katiu.main:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

# ---------- Calidad ----------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]
# Las migraciones las genera Alembic: no las reformateamos para no ensuciar los diffs.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E/F: errores básicos · I: orden de imports · UP: sintaxis moderna
# B: bugs típicos · SIM: simplificaciones · N: nombres · RUF: reglas de ruff
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
# Los services (lógica de negocio) se revisan en modo estricto.
strict = ["src/katiu/*/service.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
