{% extends "base.html" %}
{% block content %}
<a href="/mas" class="back" aria-label="Volver">{{ icon("back") }}</a>
<header class="page-head"><div><p class="eyebrow">Ajustes</p><h1>Contraseña</h1></div></header>
{% if message %}<p class="notice" role="status">{{ message }}</p>{% endif %}
{% if error %}<p class="notice notice--error" role="alert">{{ error }}</p>{% endif %}
<form class="stack mt-4" method="post" action="/ajustes/contrasena">
  <input type="hidden" name="csrf_token" value="{{ csrf(request) }}">
  <div class="field"><label for="current">Contraseña actual</label>
    <input class="input" id="current" name="current" type="password" autocomplete="current-password" required></div>
  <div class="field"><label for="new">Nueva contraseña</label>
    <input class="input" id="new" name="new" type="password" autocomplete="new-password" minlength="8" required>
    <small>Mínimo 8 caracteres.</small></div>
  <button class="btn btn--block" type="submit">Guardar</button>
</form>
{% endblock %}
